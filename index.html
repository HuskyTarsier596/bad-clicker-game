<br>
<br>
<button id="incrementButton">
  <head>
    <script src="javaScript.js" defer>
      numberOfClicks += clickAmount;
      
    </script>
  </head>
    change your score by <span id="clickAmount"></span> points
</button>

<h20> your score is: <span id="numberOfClicks"></span> </h20>
<br>
<br>
<button id="buy10Button">
  <head>
    <script src="javaScript.js" defer>
      numberOfClicks -= 25*clickAmount;
      clickAmount += 1;
    </script>
  </head>
    cost the click amount *25 for each level <span id="numberOfClicks"></span>  points to increase your click amount by 1
</button>
<br>
<br>
<h30> your CPS is: <span id="cPS"></span> </h30>
<br>
<button id="scorePerSecond1Button">
  <head>
    <script src="javaScript.js" defer>
        numberOfClicks -= 100*(cPS*3);
        cPS += 1;
    </script>
  </head>
    cost 100 points*(CPS*3) for each level
</button>
